plugins { id 'com.android.application' }
android {
    namespace 'com.smmlaba'
    compileSdk 34
    defaultConfig {
        applicationId 'com.smmlaba'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '1.3'
        manifestPlaceholders = [ymAppScheme: 'smmlaba']
        resValue 'string', 'ym_app_scheme', 'smmlaba'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.3.0'
    implementation 'androidx.navigation:navigation-ui:2.3.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'io.github.maitrungduc1410:AVLoadingIndicatorView:2.1.4'
    implementation 'commons-io:commons-io:2.6'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'ru.yoomoney.sdk.kassa.payments:yookassa-android-sdk:6.5.0'
}
